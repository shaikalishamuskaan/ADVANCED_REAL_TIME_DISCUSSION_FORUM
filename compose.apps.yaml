# Use with compose.yaml and the generated, ignored .env.docker file.
# Existing PostgreSQL/Redis services and named volumes remain in compose.yaml.
x-log-settings: &log-settings
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-python-environment: &python-environment
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_USER: ${POSTGRES_USER:?Run infrastructure/docker/prepare_env.py first}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run infrastructure/docker/prepare_env.py first}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
  JWT_ISSUER: ${JWT_ISSUER:-identity}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-forum}

x-identity: &identity
  logging: *log-settings
  image: forum-identity:local
  build:
    context: .
    dockerfile: services/identity/Dockerfile
  init: true
  environment: &identity-environment
    <<: *python-environment
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Existing Django secret is required}
    RECOVERY_CODE_HMAC_KEY: ${RECOVERY_CODE_HMAC_KEY:?Existing recovery key is required}
    SERVICE_API_KEYS: ${SERVICE_API_KEYS:?Existing service keys are required}
    JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,identity
    CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-8080},http://127.0.0.1:${FRONTEND_HOST_PORT:-8080},http://localhost:5173
    ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
    REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
    FORUM_HEALTH_URL: http://127.0.0.1:8000/api/users/me
    FORUM_HEALTH_STATUS: "401"
  secrets:
    - jwt_private
    - jwt_public

x-discussion: &discussion
  logging: *log-settings
  image: forum-discussion:local
  build:
    context: .
    dockerfile: services/discussion/Dockerfile
  init: true
  environment:
    <<: *python-environment
    FORUM_DATABASE: discussion_db
    IDENTITY_BASE_URL: http://identity:8000
    IDENTITY_SERVICE_KEY: ${DISCUSSION_SERVICE_KEY:?Existing Discussion key is required}
    SEARCH_SERVICE_KEY: ${SEARCH_SERVICE_KEY:-}
    FORUM_HEALTH_URL: http://127.0.0.1:8001/health
  secrets:
    - jwt_public

x-notification: &notification
  logging: *log-settings
  image: forum-notification-realtime:local
  build:
    context: .
    dockerfile: services/notification_realtime/Dockerfile
  init: true
  environment:
    <<: *python-environment
    FORUM_DATABASE: notification_db
    IDENTITY_BASE_URL: http://identity:8000
    IDENTITY_SERVICE_KEY: ${NOTIFY_SERVICE_KEY:?Existing Notify key is required}
    FORUM_HEALTH_URL: http://127.0.0.1:8002/health
  secrets:
    - jwt_public

x-search: &search
  logging: *log-settings
  image: forum-search:local
  build:
    context: .
    dockerfile: services/search/Dockerfile
  init: true
  environment:
    <<: *python-environment
    FORUM_DATABASE: search_db
    SEARCH_SERVICE_KEY: ${SEARCH_SERVICE_KEY:-}
    FORUM_HEALTH_URL: http://127.0.0.1:8003/health
  secrets:
    - jwt_public

services:
  identity-migrate:
    <<: *identity
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  identity:
    <<: *identity
    restart: unless-stopped
    depends_on:
      identity-migrate:
        condition: service_completed_successfully

  identity-outbox:
    <<: *identity
    command: ["python", "manage.py", "run_outbox_relay", "--wait-for-lock"]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      identity:
        condition: service_healthy

  identity-audit:
    <<: *identity
    command: ["python", "manage.py", "consume_events"]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      identity:
        condition: service_healthy

  discussion-migrate:
    <<: *discussion
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  discussion:
    <<: *discussion
    restart: unless-stopped
    depends_on:
      discussion-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy

  notification-migrate:
    <<: *notification
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  notification-realtime:
    <<: *notification
    restart: unless-stopped
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy

  search-migrate:
    <<: *search
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  search:
    <<: *search
    restart: unless-stopped
    depends_on:
      search-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    logging: *log-settings
    image: forum-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:8080"
    depends_on:
      identity:
        condition: service_healthy
      discussion:
        condition: service_healthy
      notification-realtime:
        condition: service_healthy
      search:
        condition: service_healthy

secrets:
  jwt_private:
    file: ./services/identity/keys/jwt-private.pem
  jwt_public:
    file: ./services/identity/keys/jwt-public.pem
