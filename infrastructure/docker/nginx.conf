map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

log_format forum_json escape=json '{"timestamp":"$time_iso8601","service":"frontend-gateway","event":"gateway.request","request_id":"$request_id","method":"$request_method","status":$status,"duration_seconds":$request_time,"upstream_status":"$upstream_status"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    access_log /dev/stdout forum_json;
    # Routine Nginx error messages embed raw URLs; status/upstream status are
    # captured safely in the JSON access log instead.
    error_log /dev/stderr crit;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $request_id always;
    # Re-resolve container addresses after an API container is replaced.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    set $identity_upstream http://identity:8000;
    set $discussion_upstream http://discussion:8001;
    set $notification_upstream http://notification-realtime:8002;
    set $search_upstream http://search:8003;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location = /healthz { access_log off; return 200 'healthy'; }
    location /api/auth/ { proxy_pass $identity_upstream; }
    location /api/users/ { proxy_pass $identity_upstream; }
    location /api/admin/ { proxy_pass $identity_upstream; }
    location /api/forum { proxy_pass $discussion_upstream; }
    location /api/notifications { proxy_pass $notification_upstream; }
    location /api/search { proxy_pass $search_upstream; }
    location = /ws {
        proxy_pass $notification_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90s;
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; add_header X-Request-ID $request_id always; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; add_header X-Request-ID $request_id always; }
}
