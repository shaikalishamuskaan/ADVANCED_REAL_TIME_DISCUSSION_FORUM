map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    # Re-resolve container addresses after an API container is replaced.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    set $identity_upstream http://identity:8000;
    set $discussion_upstream http://discussion:8001;
    set $notification_upstream http://notification-realtime:8002;
    set $search_upstream http://search:8003;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz { access_log off; return 200 'healthy'; }
    location /api/auth/ { proxy_pass $identity_upstream; }
    location /api/users/ { proxy_pass $identity_upstream; }
    location /api/admin/ { proxy_pass $identity_upstream; }
    location /api/forum { proxy_pass $discussion_upstream; }
    location /api/notifications { proxy_pass $notification_upstream; }
    location /api/search { proxy_pass $search_upstream; }
    location = /ws {
        proxy_pass $notification_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
